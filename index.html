<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-body);
    font-size:var(--base-size);min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ---------- unified header ---------- */
  .topbar{display:flex;align-items:center;gap:16px;padding:22px 24px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:40}
  .hdr-id{display:flex;align-items:center;gap:13px;min-width:0;flex:0 1 auto}
  .hdr-pic{width:46px;height:46px;border-radius:50%;object-fit:cover;flex-shrink:0;
    background:var(--line);cursor:pointer}
  .hdr-txt{min-width:0}
  .hdr-name{font-family:var(--font-display);font-weight:700;font-size:1.12em;line-height:1.2;
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-name em{color:var(--accent2);font-style:italic;font-weight:500}
  .hdr-bio{font-size:.8em;color:var(--ink-soft);line-height:1.4;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:400px}
  .hdr-socials{display:flex;gap:15px;align-items:center;flex-shrink:0;margin-left:auto}
  .social-link{font-size:.72em;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
    position:relative;transition:color .18s ease}
  .social-link::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;
    background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .2s ease}
  .social-link:hover{color:var(--accent)}
  .social-link:hover::after{transform:scaleX(1)}

  /* centered variant */
  .topbar.center{flex-direction:column;align-items:center;gap:11px;padding:26px 24px 20px;text-align:center}
  .topbar.center .hdr-id{flex-direction:column;gap:8px;flex:none;text-align:center}
  .topbar.center .hdr-pic{width:60px;height:60px}
  .topbar.center .hdr-bio{max-width:440px;white-space:normal}
  .topbar.center .hdr-name{white-space:normal}
  .topbar.center .nav{justify-content:center;flex-wrap:wrap}
  @media(max-width:640px){
    .topbar{flex-wrap:wrap;gap:12px;padding:18px 16px}
    .hdr-bio{white-space:normal;max-width:none}
    .hdr-socials{gap:12px}
    .nav{width:100%;justify-content:center;flex-wrap:wrap}
  }

  .nav{display:flex;gap:4px;align-items:center;flex-shrink:0;margin-left:22px}
  .topbar.center .hdr-socials{margin-left:0}
  .topbar.center .nav{margin-left:0}
  .nav-item{position:relative}
  .nav-link{font-family:var(--font-mono);font-size:.72em;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 12px;cursor:pointer;color:var(--ink-soft);border-radius:var(--radius-sm);white-space:nowrap;
    display:flex;align-items:center;gap:5px;background:none;border:none}
  .nav-link:hover,.nav-link.active{color:var(--ink);background:var(--accent-wash)}
  .dropdown{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);min-width:190px;
    border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow-hover);
    padding:6px;display:none;z-index:50}
  .dropdown.open{display:block}
  .dropdown a{display:block;padding:8px 11px;font-size:.82em;border-radius:6px;cursor:pointer;color:var(--ink)}
  .dropdown a:hover{background:var(--accent-wash);color:var(--accent)}
  .dropdown .dd-head{font-family:var(--font-mono);font-size:.62em;text-transform:uppercase;
    letter-spacing:.08em;color:var(--ink-soft);padding:7px 11px 4px}

  .pill{font-family:var(--font-mono);font-size:.68em;letter-spacing:.04em;text-transform:uppercase;
    border:1px solid var(--ink);padding:6px 11px;cursor:pointer;background:none;color:var(--ink);
    border-radius:var(--radius-sm);white-space:nowrap}
  .pill:hover{background:var(--ink);color:var(--paper)}
  .pill.solid{background:var(--ink);color:var(--paper)}
  .pill.solid:hover{background:var(--accent)}

  /* icon button (copy link) */
  .icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:var(--card);border-radius:50%;cursor:pointer;color:var(--ink-soft);
    transition:all .18s ease;flex-shrink:0}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
  .icon-btn svg{width:15px;height:15px}

  .disc-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.68em;
    letter-spacing:.03em;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:all .18s ease}
  .disc-chip:hover{border-color:var(--accent);color:var(--accent)}
  .disc-chip .q{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
    border-radius:50%;background:var(--ink-soft);color:var(--paper);font-size:.62em;font-weight:700}
  .disc-chip:hover .q{background:var(--accent)}

  main{max-width:1180px;margin:0 auto;padding:26px 22px 70px}

  /* ---------- category cards (amazon-storefront style) ---------- */
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
  .cat-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
    cursor:pointer;border:var(--card-border);transition:transform .18s ease,box-shadow .18s ease}
  .cat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .cat-collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
    gap:2px;aspect-ratio:1/1;background:var(--line)}
  .cat-collage.one{grid-template-columns:1fr;grid-template-rows:1fr}
  .cat-collage.two{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
  .cat-collage img{width:100%;height:100%;object-fit:cover;display:block;background:var(--line)}
  .cat-card .body{padding:13px 15px 16px}
  .cat-card h3{font-family:var(--font-display);font-weight:600;font-size:1em;margin:0 0 4px;line-height:1.25}
  .cat-card .count{font-family:var(--font-mono);font-size:.66em;color:var(--ink-soft)}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .section-head h2{font-family:var(--font-display);font-weight:600;font-size:1.15em;margin:0}
  .section-head .count{font-family:var(--font-mono);font-size:.68em;color:var(--ink-soft)}

  /* ---------- collections grid ---------- */
  .masonry{column-count:4;column-gap:18px}
  @media(max-width:1000px){.masonry{column-count:3}}
  @media(max-width:720px){.masonry{column-count:2}}
  @media(max-width:440px){.masonry{column-count:1}}
  .collection-card{break-inside:avoid;margin-bottom:18px;background:var(--card);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);display:block;cursor:pointer;border:var(--card-border);
    transition:transform .18s ease,box-shadow .18s ease}
  .collection-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .collection-card img{width:100%;display:block;object-fit:cover;background:var(--line)}
  .collection-card .body{padding:12px 14px 15px}
  .collection-card h3{font-family:var(--font-display);font-weight:600;font-size:.98em;line-height:1.25;margin:0 0 5px}
  .meta{font-family:var(--font-mono);font-size:.66em;color:var(--ink-soft);display:flex;gap:12px}

  .back-link{display:inline-block;font-family:var(--font-mono);font-size:.7em;text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:18px;cursor:pointer;color:var(--ink-soft)}
  .back-link:hover{color:var(--accent)}

  /* ---------- collection page: compact hero, big products ---------- */
  .collection-hero{display:grid;grid-template-columns:170px 1fr;gap:20px;background:var(--card);
    border-radius:var(--radius);padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow);
    border:var(--card-border);align-items:center}
  @media(max-width:600px){.collection-hero{grid-template-columns:120px 1fr;gap:14px;padding:14px}}
  .collection-hero img{width:100%;border-radius:var(--radius-sm);object-fit:cover;
    aspect-ratio:1/1;background:var(--line)}
  .collection-hero h1{font-family:var(--font-display);font-weight:700;font-size:1.35em;margin:0 0 6px;line-height:1.1}
  .collection-hero .desc{color:var(--ink-soft);font-size:.84em;line-height:1.5;margin:0 0 10px}
  .share-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
  @media(max-width:640px){.product-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}}
  .product-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
    display:block;cursor:pointer;border:var(--card-border);transition:transform .18s ease,box-shadow .18s ease}
  .product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .product-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--line)}
  .product-card .body{padding:12px 14px 16px}
  .product-card h4{font-family:var(--font-display);font-size:.92em;font-weight:600;margin:0 0 4px;line-height:1.3}
  .product-card .price{font-family:var(--font-mono);font-size:.74em;color:var(--accent)}
  .product-card .cat{font-family:var(--font-mono);font-size:.62em;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.05em;margin-top:5px;display:block}

  /* ---------- product page ---------- */
  .product-hero{display:grid;grid-template-columns:400px 1fr;gap:34px;background:var(--card);
    border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);max-width:900px;margin:0 auto;border:var(--card-border)}
  @media(max-width:700px){.product-hero{grid-template-columns:1fr;padding:20px}}
  .product-hero img{width:100%;border-radius:var(--radius-sm);object-fit:cover;aspect-ratio:1/1;background:var(--line)}
  .product-hero h1{font-family:var(--font-display);font-weight:700;font-size:1.55em;margin:0 0 8px;line-height:1.1}
  .product-hero .price{font-family:var(--font-mono);color:var(--accent);font-size:1em;display:block;margin-bottom:12px}
  .product-hero .desc{color:var(--ink-soft);font-size:.88em;line-height:1.6;margin-bottom:18px}
  .shop-btn{display:inline-block;font-family:var(--font-mono);font-size:.78em;text-transform:uppercase;
    letter-spacing:.05em;background:var(--ink);color:var(--paper);padding:12px 22px;
    border-radius:var(--radius-sm);transition:background .2s ease}
  .shop-btn:hover{background:var(--accent)}
  .see-full{display:block;margin-top:14px;font-size:.76em;color:var(--accent2);text-decoration:underline;cursor:pointer}

  footer{max-width:720px;margin:50px auto 0;padding:0 22px 30px;text-align:center}

  .overlay{position:fixed;inset:0;background:rgba(20,16,12,.55);display:none;align-items:center;
    justify-content:center;padding:18px;z-index:200}
  .overlay.open{display:flex}
  .modal{background:var(--paper);max-width:480px;width:100%;padding:28px;border-radius:var(--radius);
    position:relative;max-height:85vh;overflow:auto}
  .modal h3{font-family:var(--font-display);margin:0 0 12px;font-size:1.15em}
  .modal p{font-size:.85em;line-height:1.65;color:var(--ink-soft);margin:0 0 12px}
  .modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:1.05em;cursor:pointer;color:var(--ink)}

  /* ================= EDITOR ================= */
  .editor-wrap{max-width:1000px;margin:0 auto}
  .ed-tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
  .ed-tab{font-family:var(--font-mono);font-size:.72em;text-transform:uppercase;letter-spacing:.05em;
    padding:9px 15px;border:1px solid var(--ink);background:none;cursor:pointer;color:var(--ink);border-radius:var(--radius-sm)}
  .ed-tab.active{background:var(--ink);color:var(--paper)}
  .ed-panel{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);
    margin-bottom:18px;border:var(--card-border)}
  .ed-panel h3{font-family:var(--font-display);font-size:1.05em;margin:0 0 4px}
  .ed-panel .hint{font-size:.78em;color:var(--ink-soft);margin:0 0 16px;line-height:1.55}

  .field{margin-bottom:14px}
  .field label{display:block;font-family:var(--font-mono);font-size:.66em;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink-soft);margin-bottom:5px}
  .field input[type=text],.field input[type=password],.field textarea,.field select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font-family:var(--font-body);font-size:.86em;background:#fff;color:#221D17}
  .field textarea{min-height:70px;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:600px){.row2{grid-template-columns:1fr}}

  .btn{font-family:var(--font-mono);font-size:.72em;text-transform:uppercase;letter-spacing:.04em;
    padding:9px 15px;border:none;border-radius:var(--radius-sm);cursor:pointer;background:var(--ink);color:var(--paper)}
  .btn:hover{background:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:none;border:1px solid var(--ink);color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:var(--paper)}
  .btn.danger{background:none;border:1px solid #A33;color:#A33}
  .btn.danger:hover{background:#A33;color:#fff}
  .btn.small{padding:6px 10px;font-size:.66em}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

  /* image dropzone */
  .dropzone{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;
    cursor:pointer;transition:all .18s ease;background:var(--paper)}
  .dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-wash)}
  .dropzone p{margin:0;font-size:.76em;color:var(--ink-soft);line-height:1.5}
  .dropzone strong{color:var(--ink)}
  .img-row{display:flex;gap:12px;align-items:flex-start}
  .img-row .preview{width:74px;height:74px;object-fit:cover;border-radius:8px;
    border:1px solid var(--line);background:var(--line);flex-shrink:0}
  .img-row .dz-wrap{flex:1;min-width:0}

  .look-list{display:flex;flex-direction:column;gap:10px}
  .look-row{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;cursor:grab;transition:border-color .15s ease,box-shadow .15s ease}
  .look-row:hover{border-color:var(--accent)}
  .look-row.dragging{opacity:.35}
  .look-row.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
  .grip{font-size:1.1em;color:var(--ink-soft);line-height:1;user-select:none;cursor:grab}
  .look-row img{width:52px;height:52px;object-fit:cover;border-radius:6px;background:var(--line);flex-shrink:0}
  .look-row .info{flex:1;min-width:0}
  .look-row .info strong{font-family:var(--font-display);font-size:.95em;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .look-row .info span{font-family:var(--font-mono);font-size:.66em;color:var(--ink-soft)}
  .look-row .acts{display:flex;gap:6px;flex-shrink:0}

  .item-block{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:var(--paper)}
  .item-block-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .item-block-head strong{font-family:var(--font-display);font-size:.95em}

  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .swatch{cursor:pointer;border:2px solid transparent;border-radius:10px;padding:10px;text-align:left;background:#fff}
  .swatch.active{border-color:var(--ink)}
  .swatch .bars{display:flex;gap:4px;margin-bottom:8px}
  .swatch .bars i{width:100%;height:26px;border-radius:4px;display:block}
  .swatch span{font-family:var(--font-mono);font-size:.66em;text-transform:uppercase;letter-spacing:.04em;color:#221D17}
  .color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
  .color-field{display:flex;align-items:center;gap:8px}
  .color-field input[type=color]{width:38px;height:34px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff;cursor:pointer}
  .color-field label{font-family:var(--font-mono);font-size:.62em;text-transform:uppercase;color:var(--ink-soft)}
  .font-preview{font-size:1.15em;margin-top:6px;padding:10px 12px;background:var(--paper);
    border-radius:8px;border:1px solid var(--line)}

  .save-bar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
    padding:14px 22px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;z-index:25}
  .save-status{font-family:var(--font-mono);font-size:.66em;color:var(--ink-soft)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.green{background:#3A7D44}.dot.amber{background:#C8952E}.dot.grey{background:#999}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:11px 20px;border-radius:8px;font-family:var(--font-mono);font-size:.72em;opacity:0;
    pointer-events:none;transition:opacity .25s ease;z-index:300;max-width:90vw;text-align:center}
  .toast.show{opacity:1}

  .link-preview{font-family:var(--font-mono);font-size:.66em;color:var(--accent2);word-break:break-all;margin-top:4px}
  .callout{background:var(--accent-wash);border-left:3px solid var(--accent);padding:12px 14px;
    border-radius:6px;font-size:.78em;line-height:1.6;color:var(--ink-soft);margin-bottom:14px}
  .callout strong{color:var(--ink)}
  ol.steps{font-size:.8em;line-height:1.7;color:var(--ink-soft);padding-left:20px;margin:0 0 14px}
  ol.steps strong{color:var(--ink)}
  code{font-family:var(--font-mono);font-size:.8em;background:var(--accent-wash);padding:2px 5px;border-radius:4px}

  .empty{text-align:center;color:var(--ink-soft);font-size:.85em;padding:40px 0}
  .cat-row{display:flex;flex-direction:column;gap:8px}
  .cat-item{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;cursor:grab}
  .cat-item.dragging{opacity:.35}
  .cat-item.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
  .cat-item input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
    font-family:var(--font-body);font-size:.86em;background:#fff;color:#221D17;min-width:0}
  .range-val{font-family:var(--font-mono);font-size:.72em;color:var(--accent)}
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<main id="app"></main>
<footer><span class="disc-chip" onclick="openModal()">Affiliate Disclaimer <span class="q">?</span></span></footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>Affiliate Disclaimer</h3>
    <p id="modalText"></p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ===DATA_START===
   ========================================================= */

async function boot(){

function deepMerge(b,o){for(const k in o){
  if(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])&&b[k])deepMerge(b[k],o[k]);else b[k]=o[k];}return b;}
function saveDraft(){dirty=true;try{localStorage.setItem(DRAFT_KEY,JSON.stringify(SITE));}catch(e){}updateStatus();}

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isAuthed(){
  try{ return localStorage.getItem(AUTH_KEY)===SITE.editAuth.passHash; }catch(e){ return false; }
}
function setAuthed(hash){ try{ localStorage.setItem(AUTH_KEY,hash); }catch(e){} }
function logout(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} navigate('#/'); renderNav(); toast('logged out'); }

function applyTheme(){
  const t=SITE.theme,r=document.documentElement.style;
  r.setProperty('--paper',t.paper);r.setProperty('--ink',t.ink);r.setProperty('--card',t.card);
  r.setProperty('--accent',t.accent);r.setProperty('--accent2',t.accent2);
  r.setProperty('--ink-soft',hexAlpha(t.ink,.66));r.setProperty('--line',hexAlpha(t.ink,.14));
  r.setProperty('--accent-wash',hexAlpha(t.accent,.10));
  r.setProperty('--font-display',`'${t.fontDisplay}', serif`);
  r.setProperty('--font-body',`'${t.fontBody}', sans-serif`);
  r.setProperty('--font-mono',`'${t.fontMono}', monospace`);
  r.setProperty('--base-size',(t.baseSize||16)+'px');
  r.setProperty('--radius',t.radius+'px');
  r.setProperty('--radius-sm',Math.max(4,Math.round(t.radius*.45))+'px');
  const S={soft:{s:'0 6px 18px '+hexAlpha(t.ink,.14),h:'0 14px 26px '+hexAlpha(t.ink,.20),b:'none'},
    flat:{s:'none',h:'none',b:'1px solid '+hexAlpha(t.ink,.18)},
    hard:{s:'4px 4px 0 '+t.ink,h:'6px 6px 0 '+t.accent,b:'1.5px solid '+t.ink},
    lifted:{s:'0 12px 30px '+hexAlpha(t.ink,.22),h:'0 20px 40px '+hexAlpha(t.ink,.28),b:'none'}};
  const st=S[t.cardStyle]||S.soft;
  r.setProperty('--shadow',st.s);r.setProperty('--shadow-hover',st.h);r.setProperty('--card-border',st.b);
  document.getElementById('modalText').textContent=SITE.disclosure;
  document.title=(SITE.profile&&SITE.profile.name)||SITE.siteName;
}
function hexAlpha(hex,a){const h=(hex||'#000').replace('#','');
  const n=h.length===3?h.split('').map(c=>c+c).join(''):h;
  return `rgba(${parseInt(n.slice(0,2),16)},${parseInt(n.slice(2,4),16)},${parseInt(n.slice(4,6),16)},${a})`;}

/* ================= IMAGE UPLOAD ================= */
function compress(file,maxW){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.width);
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.82));
      };
      img.onerror=()=>rej(new Error('bad image'));
      img.src=r.result;
    };
    r.onerror=()=>rej(new Error('read failed'));
    r.readAsDataURL(file);
  });
}
async function handleImage(file,setPath,maxW){
  if(!file||!file.type.startsWith('image/')){toast('that file isn\'t an image');return;}
  toast('processing image...');
  let dataUrl;
  try{ dataUrl=await compress(file,maxW||1000); }
  catch(e){ toast('could not read that image'); return; }

  const {owner,repo,branch}=SITE.publish, tok=getToken();
  if(owner&&repo&&tok){
    try{
      const name=`img-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const path=`images/${name}`;
      const b64=dataUrl.split(',')[1];
      const res=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{
        method:'PUT',
        headers:{Authorization:`Bearer ${tok}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
        body:JSON.stringify({message:`add image ${name}`,content:b64,branch})
      });
      if(res.ok){ setPath(path); toast('image uploaded'); return; }
      toast('upload failed — storing locally instead');
    }catch(e){ toast('upload failed — storing locally instead'); }
  }
  setPath(dataUrl);
  toast(owner&&repo&&tok?'stored in page':'image added (connect publishing to store properly)');
}
function dropzoneHTML(id,hintText){

      ondrop="dzDrop(event,'${id}')">
      <p><strong>drop an image here</strong> or click to choose<br>${hintText||''}</p>
    </div>
    <input type="file" id="fi-${id}" accept="image/*" style="display:none" onchange="dzPick(event,'${id}')">`;
}

function addCategory(){

function renameCategory(i,val){
  const old=SITE.categories[i];
  SITE.categories[i]=val;
  /* keep products pointing at the renamed category */
  SITE.collections.forEach(c=>c.products.forEach(p=>{ if(p.category===old) p.category=val; }));
  clearTimeout(renameCategory._t);
  renameCategory._t=setTimeout(()=>{saveDraft();renderNav();},300);
}
function deleteCategory(i){
  const name=SITE.categories[i];
  const inUse=allProducts().filter(p=>p.category===name).length;
  if(inUse&&!confirm(`${inUse} product${inUse===1?' is':'s are'} in "${name}". Deleting the category will leave ${inUse===1?'it':'them'} uncategorized. Continue?`))return;
  SITE.collections.forEach(c=>c.products.forEach(p=>{ if(p.category===name) p.category=""; }));
  SITE.categories.splice(i,1);
  saveDraft();renderEditText();renderNav();
}

  if(!confirm("Reset categories back to the defaults?"))return;
  SITE.categories=[...DEFAULT_SITE.categories];
  saveDraft();renderEditText();renderNav();
}

          <input type="text" value="${esc(c.branch)}" oninput="updPub('branch',this.value)" placeholder="main"></div>
        <div class="field"><label>data file path</label>
          <input type="text" value="${esc(c.path)}" oninput="updPub('path',this.value)" placeholder="data.json"></div></div>
      <div class="field"><label>access token ${tok?'(saved)':''}</label>
        <input type="password" value="${esc(tok)}" oninput="setToken(this.value)" placeholder="github_pat_..."></div>
      <div class="btn-row">
        <button class="btn ghost" onclick="testConnection()">test connection</button>
        <button class="btn danger small" onclick="setToken('');renderEditPublish();toast('token cleared')">clear token</button></div>
    </div>
    <div class="ed-panel">
      <h3>edit password</h3>
      <p class="hint">protects the editor on this site. after changing it, hit "publish changes" below so it takes effect everywhere, not just this browser.</p>
      <div class="field"><label>current password</label>
        <input type="password" id="curPass" placeholder="current password"></div>
      <div class="row2">
        <div class="field"><label>new password</label>
          <input type="password" id="newPass1" placeholder="new password"></div>
        <div class="field"><label>confirm new password</label>
          <input type="password" id="newPass2" placeholder="confirm new password"></div>
      </div>
      <div class="btn-row"><button class="btn ghost" onclick="changePassword()">update password</button></div>
    </div>
    <div class="ed-panel">
      <h3>not set up yet?</h3>
      <p class="hint">everything still works — edits save in this browser, and backup downloads your content as a file.</p>
      <div class="btn-row">
        <button class="btn ghost" onclick="downloadBackup()">download backup</button>
        <button class="btn ghost" onclick="document.getElementById('restoreFile').click()">restore from backup</button>
        <input type="file" id="restoreFile" accept="application/json" style="display:none" onchange="restoreBackup(this)"></div>
    </div>`);
  updateStatus();
}
function updPub(k,v){SITE.publish[k]=v;saveDraft();}
async function changePassword(){
  const cur=document.getElementById('curPass').value;
  const n1=document.getElementById('newPass1').value;
  const n2=document.getElementById('newPass2').value;
  const curHash=await sha256(cur);
  if(curHash!==SITE.editAuth.passHash){ toast('current password is incorrect'); return; }
  if(n1.length<6){ toast('new password must be at least 6 characters'); return; }
  if(n1!==n2){ toast("new passwords don't match"); return; }
  const newHash=await sha256(n1);
  SITE.editAuth.passHash=newHash;
  setAuthed(newHash);
  saveDraft();
  toast('password updated — publish to apply everywhere');
  renderEditPublish();
}

async function testConnection(){
  const {owner,repo,branch,path}=SITE.publish,tok=getToken();
  if(!owner||!repo||!tok){toast('fill in username, repo, and token first');return;}
  try{
    const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`,
      {headers:{Authorization:`Bearer ${tok}`,Accept:'application/vnd.github+json'}});
    if(r.status===404)toast('connected — data.json will be created on first publish');
    else if(r.ok)toast('connected and working');
    else if(r.status===401||r.status===403)toast('token rejected — check permissions');
    else toast('unexpected response: '+r.status);
  }catch(e){toast('could not reach github');}
}
async function publish(){
  const {owner,repo,branch,path}=SITE.publish,tok=getToken();
  if(!owner||!repo||!tok){toast('set up publishing first');navigate('#/edit/publish');return;}
  const btn=document.getElementById('pubBtn');
  if(btn){btn.disabled=true;btn.textContent='publishing...';}
  try{
    const url=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    let sha=null;
    const cur=await fetch(`${url}?ref=${branch}`,{headers:{Authorization:`Bearer ${tok}`,Accept:'application/vnd.github+json'}});
    if(cur.ok)sha=(await cur.json()).sha;
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(SITE,null,2))));
    const res=await fetch(url,{method:'PUT',
      headers:{Authorization:`Bearer ${tok}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:`update site — ${new Date().toLocaleString()}`,content,branch,...(sha?{sha}:{})})});
    if(res.ok){dirty=false;try{localStorage.removeItem(DRAFT_KEY);}catch(e){}toast('published — live in ~30 seconds');}
    else{const e=await res.json().catch(()=>({}));toast('publish failed: '+(e.message||res.status));}
  }catch(e){toast('publish failed — check your connection');}
  if(btn){btn.disabled=false;btn.textContent='publish changes';}
  updateStatus();
}

function upd(path,val){const p=path.split('.');let o=SITE;
  for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;saveDraft();}
function updRoot(k,v){SITE[k]=v;saveDraft();applyTheme();}
function updTheme(k,v){SITE.theme[k]=v;SITE.theme.preset='custom';saveDraft();applyTheme();
  if(k==='radius'||k==='cardStyle'||k==='baseSize'||k.startsWith('font'))renderEditDesign();}
function applyPreset(k){Object.assign(SITE.theme,PRESETS[k]);delete SITE.theme.label;SITE.theme.preset=k;
  saveDraft();applyTheme();renderEditDesign();toast('palette applied');}

function addCollection(){
  const id="col-"+Date.now().toString(36);
  SITE.collections.push({id,title:"new collection",cover:"",description:"",products:[]});
  saveDraft();navigate('#/edit/collection/'+id);toast('collection added');
}
function deleteCollection(i){if(!confirm("Delete this collection and all its products?"))return;
  SITE.collections.splice(i,1);saveDraft();renderNav();renderEditCollections();toast('deleted');}
function addProduct(ci){
  SITE.collections[ci].products.push({id:"item-"+Date.now().toString(36),name:"New product",
    price:"",category:"",image:"",description:"",link:""});
  saveDraft();renderEditCollection(SITE.collections[ci].id);toast('product added');}
function deleteProduct(ci,pi){if(!confirm("Delete this product?"))return;
  SITE.collections[ci].products.splice(pi,1);saveDraft();renderNav();renderEditCollection(SITE.collections[ci].id);}
function moveProduct(ci,pi,d){const a=SITE.collections[ci].products,j=pi+d;
  if(j<0||j>=a.length)return;[a[pi],a[j]]=[a[j],a[pi]];saveDraft();renderEditCollection(SITE.collections[ci].id);}

function download(fn,txt,type){const b=new Blob([txt],{type:type||'text/plain'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function downloadBackup(){download('data.json',JSON.stringify(SITE,null,2),'application/json');toast('backup downloaded');}
function restoreBackup(input){const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{SITE=deepMerge(structuredClone(DEFAULT_SITE),JSON.parse(r.result));
    saveDraft();applyTheme();renderNav();router();toast('backup restored');}
    catch(e){toast('could not read that file');}};
  r.readAsText(f);}

function router(){
  const p=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  if(p[0]==='edit'){
    const hasPass=SITE.editAuth&&SITE.editAuth.passHash;
    if(!hasPass){ renderSetupPassword(); window.scrollTo(0,0); return; }
    if(!isAuthed()){ renderLoginGate(); window.scrollTo(0,0); return; }
    if(p[1]==='collection'&&p[2])renderEditCollection(p[2]);
    else if(p[1]==='profile')renderEditProfile();
    else if(p[1]==='design')renderEditDesign();
    else if(p[1]==='text')renderEditText();
    else if(p[1]==='publish')renderEditPublish();
    else renderEditCollections();
  }
  else if(p[0]==='shop')renderShop(p[1]?decodeURIComponent(p[1]):null);
  else if(p[0]==='collection'&&p[1])renderCollection(p[1]);
  else if(p[0]==='product'&&p[1]&&p[2])renderProduct(p[1],p[2]);
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',router);
boot();
</script>
</body>
</html>
